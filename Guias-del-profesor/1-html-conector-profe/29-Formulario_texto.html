<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Texto</title>
</head>
<body>
    <h4>Acceso de Usuario</h4>
    <form>
        Ingrese Usuario:
        <input type="text" id="usuario">
        <br><br>
        Ingrese Clave:<br>
        <input type="password" id="clave">
        <br><br>
        <input type="button" value="confirmar" onclick="verificar()">
    </form>
    <script>
        let control = 0;
        let contrasena = 'acceso2026';
        function verificar(){
            let varclave = document.getElementById('clave').value;
            if(varclave !=contrasena || varclave == ""){
                alert('ERROR, clave incorrecta o Vacia, intente nuevamente');
                control++
                if(control >= 3){
                    alert('INTENTOS AGOTADOS, Acceso BLOQUEADO - Contactar a Soporte Técnico');
                }
            }else{
                window.open("http://www.google.com");
            }
        }
    </script>

</body>
</html>
