<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes básicas</title>
    <style>
        img { max-width: 100%; width: 150px; }
    </style>
</head>
<body>
    <!--
        IMG: inserta imágenes.
        - src: ruta de la imagen (local o URL).
        - alt: texto alternativo (accesibilidad, fallback).
    -->
    <h1>Imagen desde archivo local (ejemplo)</h1>
    <img src="imagenes/ejemplo.jpg" alt="Descripción de la imagen">
    <!-- Si no existe, muestra el texto alternativo -->
</body>
</html>
