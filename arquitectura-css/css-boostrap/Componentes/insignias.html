<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>insignias o badge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container py-4">
      <span class="badge bg-primary">primary</span>
      <span class="badge bg-secondary">secondary</span>
      <span class="badge bg-success">success</span>
      <span class="badge bg-danger">danger</span>
      <span class="badge bg-warning">warning</span>
      <span class="badge bg-info">info</span>
      <span class="badge bg-lihgt text-dark">lihgt</span>
      <span class="badge bg-dark">dark</span>

      <hr>

      <span class="badge rounded-pill bg-primary">primary</span>
      <span class="badge rounded-pill bg-secondary">secondary</span>
      <span class="badge rounded-pill bg-success">success</span>
      <span class="badge rounded-pill bg-danger">danger</span>
      <span class="badge rounded-pill bg-warning">warning</span>
      <span class="badge rounded-pill bg-info">info</span>
      <span class="badge rounded-pill bg-lihgt text-dark">lihgt</span>
      <span class="badge rounded-pill bg-dark">dark</span>

      <hr>

      <h1>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h1>
      <h2>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h2>
      <h3>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h3>
      <h4>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h4>
      <h5>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h5>
      <h6>encabezado de <span class="badge bg-success rounded-pill">ejemplo</span></h6>

      <hr>

      <button class="btn btn-primary">
        notificaciones <span class="badge rounded-pill bg-danger" >7</span>

      </button>
    </div>
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
