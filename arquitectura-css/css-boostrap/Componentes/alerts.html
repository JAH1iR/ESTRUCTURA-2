<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    

</head>
<body>
    <div class="container py-4">

        <div class="alert alert-primary alert-dismissible">
           <span> esto es una alerta tipo primary <a class="alert-link" href="http://">Ir al sitio web</a></span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-secondary alert-dismissible">
           <span> esta es una alerta tipo secondary</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-success alert-dismissible">
           <span> esta es una alerta tipo success</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-danger alert-dismissible">
           <span> esto es una alerta tipo danger </span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-warning alert-dismissible">
           <span> esta es una alerta tipo warning</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-info alert-dismissible">
           <span> esta es una alerta tipo info</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

         <div class="alert alert-lihgt alert-dismissible">
           <span> esta es una alerta tipo lihgt</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>

          <div class="alert alert-dark alert-dismissible">
           <span> esta es una alerta tipo dark</span>
           <button class="btn-close"
            data-bs-dismiss="alert"
            area-label="close">
           </button>
        </div>
    </div>
    





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
