<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
             <form action="">
                <div class="mb-3">
                    <label class="form-label" for="name">nombre</label>
                    <input placeholder="por favor ingrese su nombre" class="form-control" name="name" type="text" name="" id="name">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">email</label>
                    <input placeholder="por favor ingrese su correo" class="form-control" name="email" type="email" name="" id="email">
                </div>

                <div>
                    <label class="form-label" for="description">descripcion</label>
                    <textarea placeholder="agrege una breve descripcion" class="form-control" name="description" id="descripcion" cols="30" rows="10"></textarea>
                </div>
             </form>
    </div>
</body>
</html>
