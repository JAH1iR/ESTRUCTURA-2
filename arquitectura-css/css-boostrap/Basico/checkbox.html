<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos seleccionables - Radio y Checkbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  
    <h1>checkbox y radio</h1>

    <h2>checkbox</h2>

       
   <div class="container py-4">
             <form action="">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkbox"> 
                <label class="form-check-label" for="checkbox"> input de tipo checkbox</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkbox2" checked> 
                <label class="form-check-label" for="checkbox2"> input de tipo checkbox2</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkbox3" disabled> 
                <label class="form-check-label" for="checkbox3"> input de tipo checkbox3</label>
            </div>
             </form>
    </div>
    <h2>radio</h2>

    <form action="">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="prueba" id="radio 1">
            <label class="form-check-label" for="radio1">input de tipo radio1</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="prueba" id="radio 2">
            <label class="form-check-label" for="radio2">input de tipo radio2</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="prueba" id="radio 3" disabled>
            <label class="form-check-label" for="radio3">input de tipo radio3</label>
        </div>
    </form>
</body>
</html>
