<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tipos de datos</title>
</head>
<body>
    <script>
        let nombre = 'Pedro';
        let cantidad = 257;
        let precio = 77.77;
        let verdad = true;
        let nulo = null;
        let persona = {nombre:'Sophia', apellido:'Loren', edad: 38, signo:'libra'};

        document.writeln(nombre);
        document.writeln('<br>');
        document.writeln(cantidad);
        document.writeln('<br>');
        document.writeln(precio);
        document.writeln('<br>');
        document.writeln(verdad);
        document.writeln('<br>');
        document.writeln(nulo);
        document.writeln('<br>');
        document.writeln(persona.nombre, ' ', persona.edad, ' ',persona.signo);
    </script>

</body>
</html>
