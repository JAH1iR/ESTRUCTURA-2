<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas de línea</title>
    <style>
        span.destacar { color: red; font-weight: bold; }
        code { background-color: #f4f4f4; padding: 2px 4px; font-family: monospace; }
    </style>
</head>
<body>
    <!--
        ETIQUETAS DE LÍNEA:
        - span: contenedor genérico de línea (para CSS o JS).
        - q: cita en línea (agrega comillas).
        - code: fragmento de código.
        - Entidades especiales: caracteres reservados (ej: &lt; &gt; &amp; &copy;).
    -->
    <p>Esto es un <span class="destacar">texto destacado</span> dentro de un párrafo.</p>

    <p>Como dijo <q cite="https://ejemplo.com">Sé el cambio que quieres ver en el mundo</q>.</p>

    <p>Para usar la etiqueta <code>&lt;div&gt;</code> en HTML, se escribe así.</p>

    <p>Entidades especiales: 
        menor que &lt; , 
        mayor que &gt; , 
        ampersand &amp; , 
        copyright &copy; .
    </p>
</body>
</html>
