<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 3</title>
</head>
<body>
    <!--
        INPUTS PARA DATOS ESPECÍFICOS:
        - search: barra de búsqueda.
        - tel: teléfono (no valida formato, solo muestra teclado en móvil).
        - email: correo electrónico (validación básica).
        - password: contraseña (oculta caracteres).
        - url: dirección web.
    -->
    <form>
        <div><label>Búsqueda: <input type="search"></label></div>
        <div><label>Teléfono: <input type="tel"></label></div>
        <div><label>Email: <input type="email"></label></div>
        <div><label>Contraseña: <input type="password"></label></div>
        <div><label>URL: <input type="url"></label></div>
    </form>
</body>
</html>
