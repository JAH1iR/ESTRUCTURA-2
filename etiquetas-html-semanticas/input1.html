<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 1</title>
</head>
<body>
    <!--
        INPUT TYPE:
        - button: botón sin envío de datos (similar a <button>).
        - submit: envía el formulario.
        - Otros tipos se ven en archivos siguientes.
    -->
    <form action="#">
        <input type="button" value="Botón input (no envía)">
        <input type="submit" value="Enviar con input submit">
        <button>Botón button (envía por defecto)</button>
    </form>
</body>
</html>
