<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalist (lista de sugerencias)</title>
</head>
<body>
    <!--
        DATALIST: proporciona opciones de autocompletado para un input.
        Se vincula con el atributo list del input.
    -->
    <h1>Búsqueda con sugerencias</h1>
    <form>
        <label for="mascota">Mascota:</label>
        <input type="text" id="mascota" name="mascota" list="mascotas" placeholder="Escribe o selecciona">
        <datalist id="mascotas">
            <option value="Perro">
            <option value="Gato">
            <option value="Hamster">
            <option value="Loro">
            <option value="Serpiente">
        </datalist>
    </form>
</body>
</html>
