<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select con optgroup</title>
</head>
<body>
    <!--
        OPTGROUP: agrupa opciones dentro de un select.
        Atributo label: nombre de la categoría.
    -->
    <h1>Mascotas - Categorías</h1>
    <form>
        <label for="mascotas">Elige una mascota:</label>
        <select id="mascotas" name="mascotas">
            <optgroup label="4 patas">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
                <option value="hamster">Hamster</option>
            </optgroup>
            <optgroup label="Aves">
                <option value="loro">Loro</option>
                <option value="canario">Canario</option>
            </optgroup>
            <optgroup label="Otras">
                <option value="serpiente">Serpiente</option>
                <option value="tarantula">Tarántula</option>
            </optgroup>
        </select>
    </form>
</body>
</html>
