<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos de formularios</title>
</head>
<body>
    <!--
        ATRIBUTOS COMUNES:
        - placeholder: texto de ayuda dentro del campo.
        - required: campo obligatorio.
        - readonly: solo lectura.
        - disabled: campo deshabilitado.
        - min, max: valores mínimo y máximo (number/range/date).
        - minlength, maxlength: longitud de texto.
        - selected: opción por defecto en select.
        - autofocus: el campo recibe el foco al cargar.
    -->
    <h1>Atributos de formularios</h1>
    <form>
        <label for="nombre">Nombre obligatorio:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required><br>
        <label for="solo-lectura">Campo de solo lectura:</label>
        <input type="text" id="solo-lectura" name="solo_lectura" value="Solo lectura" readonly><br>
        <label for="deshabilitado">Campo deshabilitado:</label>
        <input type="text" id="deshabilitado" name="deshabilitado" value="Deshabilitado" disabled><br>

        <select name="numeros">
            <option value="1">Uno</option>
            <option value="2" selected>Dos (seleccionado)</option>
        </select><br>

        <label for="numero">Número entre 5 y 10:</label>
        <input type="number" id="numero" name="numero" min="5" max="10"><br>
        <label for="texto">Texto de 3 a 5 caracteres:</label>
        <input type="text" id="texto" name="texto" minlength="3" maxlength="5" required autofocus><br>

        <input type="submit">
    </form>
</body>
</html>
