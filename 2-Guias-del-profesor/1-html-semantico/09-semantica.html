<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 - Semántica HTML</title>
</head>
<body>
  <!--
    Paso 9: semántica.
    Se usan etiquetas que describen la función del contenido.
    header, nav, main, section, article, aside, footer.
  -->

  <header>
    <h1>Mi sitio web</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Cursos</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Artículo principal</h2>
      <article>
        <p>La semántica mejora la accesibilidad y la comprensión del contenido.</p>
      </article>
    </section>

    <aside>
      <h3>Información adicional</h3>
      <p>Este bloque es lateral y complementario.</p>
    </aside>
  </main>

  <footer>
    <p>© 2026 - Todos los derechos reservados</p>
  </footer>
</body>
</html>
