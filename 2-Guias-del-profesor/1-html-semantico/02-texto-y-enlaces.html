<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 - Texto y enlaces</title>
</head>
<body>
  <!--
    Paso 2: textos y enlaces.
    Aquí vemos los elementos más básicos para presentar información.
    - h1...h6 para títulos
    - p para párrafos
    - a para enlaces
    - strong/em para dar énfasis
  -->

  <h1>Título principal</h1>
  <h2>Subtítulo</h2>

  <p>Este es un <strong>texto importante</strong> dentro de un párrafo.</p>
  <p>También puedes poner <em>énfasis</em> en una parte del contenido.</p>

  <a href="https://www.google.com" target="_blank">Visitar Google</a>

  <p>
    Puedes crear enlaces a otras páginas, archivos o secciones dentro del mismo documento.
  </p>
</body>
</html>
