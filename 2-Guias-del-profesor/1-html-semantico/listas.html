<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en HTML</title>
</head>
<body>
    <!--
        TIPOS DE LISTAS:
        - ul: lista desordenada (disc, circle, square mediante CSS).
        - ol: lista ordenada (1, A, a, I, i). Atributos: type, start.
        - dl: lista de definición (dt: término, dd: descripción).
        - Se pueden anidar.
    -->
    <style>
        .lista-cuadrada { list-style-type: square; }
    </style>
    <h1>Listas HTML</h1>
    <h2>Lista desordenada (ul)</h2>
    <ul class="lista-cuadrada">
        <li>Pan</li>
        <li>Leche</li>
        <li>Huevos</li>
    </ul>

    <h2>Lista ordenada (ol)</h2>
    <ol type="I" start="3">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Lista anidada</h2>
    <ol>
        <li>HTML
            <ul>
                <li>Estructura</li>
                <li>Etiquetas</li>
            </ul>
        </li>
        <li>CSS</li>
    </ol>

    <h2>Lista de definición (dl)</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Lenguaje de marcado para estructura.</dd>
        <dt>CSS</dt>
        <dd>Lenguaje de estilos.</dd>
    </dl>
</body>
</html>
