<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes responsivas - srcset</title>
    <style>
        img { width: 100px; height: auto; }
    </style>
</head>
<body>
    <!--
        srcset: define diferentes versiones de una imagen según la resolución del dispositivo.
        x descriptor: para densidades de píxeles (1x, 2x, 3x).
        También se puede usar w descriptor con sizes.
    -->
    <h1>Imagen con srcset (para pantallas retina)</h1>
    <img srcset="img/chica-pequeña.jpg 1x, img/chica-grande.jpg 2x" 
         src="img/chica-default.jpg" 
         alt="Retrato de una chica">
</body>
</html>
