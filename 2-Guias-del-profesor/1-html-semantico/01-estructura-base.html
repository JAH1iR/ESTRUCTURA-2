<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 - Estructura base de HTML</title>
</head>
<body>
  <!--
    Paso 1: estructura base de una página HTML.
    - doctype: indica que el documento es HTML5.
    - html: raíz del documento.
    - head: metadatos y configuración.
    - body: contenido visible para el usuario.
  -->

  <header>
    <h1>Mi primera página</h1>
  </header>

  <main>
    <p>Este es el contenido principal de la página.</p>
    <p>HTML sirve para estructurar la información; CSS para estilos y JavaScript para interactividad.</p>
  </main>

  <footer>
    <p>Pie de página</p>
  </footer>
</body>
</html>
