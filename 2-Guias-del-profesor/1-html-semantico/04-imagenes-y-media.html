<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 - Imágenes y multimedia</title>
</head>
<body>
  <!--
    Paso 4: imágenes y multimedia.
    - img: imagen
    - picture/source: imágenes responsivas
    - audio: audio embebido
    - video: video embebido
  -->

  <h2>Imagen</h2>
  <img src="https://via.placeholder.com/300x180" alt="Imagen de ejemplo" width="300" />

  <h2>Audio</h2>
  <audio controls>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
    Tu navegador no soporta audio HTML5.
  </audio>

  <h2>Video</h2>
  <video controls width="400">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
    Tu navegador no soporta video HTML5.
  </video>
</body>
</html>
