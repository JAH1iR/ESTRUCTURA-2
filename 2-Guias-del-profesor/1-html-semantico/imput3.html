<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 3</title>
</head>
<body>
    <!--
        INPUTS PARA DATOS ESPECÍFICOS:
        - search: barra de búsqueda.
        - tel: teléfono (no valida formato, solo muestra teclado en móvil).
        - email: correo electrónico (validación básica).
        - password: contraseña (oculta caracteres).
        - url: dirección web.
    -->
    <h1>Tipos de input: datos específicos</h1>
    <form>
        <div><label for="busqueda">Búsqueda:</label> <input type="search" id="busqueda" name="busqueda"></div>
        <div><label for="telefono">Teléfono:</label> <input type="tel" id="telefono" name="telefono"></div>
        <div><label for="email">Email:</label> <input type="email" id="email" name="email"></div>
        <div><label for="contrasena">Contraseña:</label> <input type="password" id="contrasena" name="contrasena"></div>
        <div><label for="url">URL:</label> <input type="url" id="url" name="url"></div>
    </form>
</body>
</html>
