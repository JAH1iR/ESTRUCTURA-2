<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 - Listas</title>
</head>
<body>
  <!--
    Paso 3: listas.
    - ul: lista desordenada
    - ol: lista ordenada
    - dl: lista de definición
  -->

  <h2>Lista desordenada</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Lista ordenada</h2>
  <ol>
    <li>Crear estructura</li>
    <li>Definir contenido</li>
    <li>Agregar estilos</li>
  </ol>

  <h2>Lista de definición</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Lenguaje de marcado para estructurar contenido.</dd>

    <dt>CSS</dt>
    <dd>Lenguaje para dar estilo visual.</dd>
  </dl>
</body>
</html>
