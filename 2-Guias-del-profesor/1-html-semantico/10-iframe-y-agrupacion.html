<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10 - Iframe y agrupación</title>
</head>
<body>
  <!--
    Paso 10: agrupación y contenido embebido.
    div: contenedor genérico
    section: agrupación semántica
    iframe: contenido externo embebido
    blockquote/pre: citas y texto preformateado
  -->

  <section>
    <h2>Bloque de contenido</h2>
    <div>
      <p>Este es un contenedor general para agrupar elementos.</p>
    </div>
  </section>

  <blockquote>
    “La práctica constante hace que lo difícil se vuelva natural.”
  </blockquote>

  <pre>
    Este texto
    mantiene
    los saltos y espacios.
  </pre>

  <iframe src="https://www.example.com" width="600" height="300" title="Ejemplo de iframe"></iframe>
</body>
</html>
