<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista desplegable - select</title>
</head>
<body>
    <!--
        SELECT: crea una lista de opciones.
        - <option> para cada opción.
        - Atributo multiple: permite seleccionar varias (con Ctrl).
        - Atributo selected: opción preseleccionada.
    -->
    <h1>Lenguajes para diseño web</h1>
    <form>
        <label for="lenguajes">Elige un lenguaje:</label>
        <select id="lenguajes" name="lenguajes">
            <option value="html">HTML</option>
            <option value="css" selected>CSS</option>
            <option value="javascript">JavaScript</option>
        </select>
        <!-- Con multiple -->
        <label for="varios">Selecciona varios:</label>
        <select id="varios" name="varios" multiple size="3">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">JS</option>
        </select>
    </form>
</body>
</html>
