<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 4</title>
</head>
<body>
    <!--
        OTROS INPUTS ÚTILES:
        - color: selector de color.
        - number: solo valores numéricos.
        - range: deslizador para seleccionar un rango.
        - reset: reinicia el formulario a sus valores iniciales.
        - text: texto plano (por defecto).
    -->
    <h1>Otros tipos de input</h1>
    <form>
        <label for="color">Color:</label> <input type="color" id="color" name="color"><br>
        <label for="numero">Número:</label> <input type="number" id="numero" name="numero" step="1" min="0" max="100"><br>
        <label for="rango">Rango:</label> <input type="range" id="rango" name="rango" step="5" min="0" max="30"><br>
        <label for="texto">Texto:</label> <input type="text" id="texto" name="texto" placeholder="Texto libre"><br>
        <input type="reset" value="Resetear formulario">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
