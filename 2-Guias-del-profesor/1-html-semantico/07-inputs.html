<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 - Inputs y tipos de campos</title>
</head>
<body>
  <!--
    Paso 7: inputs.
    HTML ofrece varios tipos para recoger información de forma útil.
  -->

  <h2>Tipos de inputs</h2>

  <label>Texto: <input type="text" /></label><br /><br />
  <label>Email: <input type="email" /></label><br /><br />
  <label>Contraseña: <input type="password" /></label><br /><br />
  <label>Número: <input type="number" min="1" max="10" /></label><br /><br />
  <label>Fecha: <input type="date" /></label><br /><br />
  <label><input type="checkbox" /> Acepto los términos</label><br /><br />
  <label><input type="radio" name="plan" /> Básico</label>
  <label><input type="radio" name="plan" /> Pro</label>

</body>
</html>
