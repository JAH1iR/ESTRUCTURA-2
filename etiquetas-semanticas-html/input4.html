<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 4</title>
</head>
<body>
    <!--
        OTROS INPUTS ÚTILES:
        - color: selector de color.
        - number: solo valores numéricos.
        - range: deslizador para seleccionar un rango.
        - reset: reinicia el formulario a sus valores iniciales.
        - text: texto plano (por defecto).
    -->
    <form>
        <label>Color: <input type="color"></label><br>
        <label>Número: <input type="number" step="1" min="0" max="100"></label><br>
        <label>Rango: <input type="range" step="5" min="0" max="30"></label><br>
        <label>Texto: <input type="text" placeholder="Texto libre"></label><br>
        <input type="reset" value="Resetear formulario">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
