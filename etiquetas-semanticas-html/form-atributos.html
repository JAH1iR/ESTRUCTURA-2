<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos de formularios</title>
</head>
<body>
    <!--
        ATRIBUTOS COMUNES:
        - placeholder: texto de ayuda dentro del campo.
        - required: campo obligatorio.
        - readonly: solo lectura.
        - disabled: campo deshabilitado.
        - min, max: valores mínimo y máximo (number/range/date).
        - minlength, maxlength: longitud de texto.
        - selected: opción por defecto en select.
        - autofocus: el campo recibe el foco al cargar.
    -->
    <form>
        <input type="text" placeholder="Nombre obligatorio" required><br>
        <input type="text" value="Solo lectura" readonly><br>
        <input type="text" value="Deshabilitado" disabled><br>

        <select name="numeros">
            <option value="1">Uno</option>
            <option value="2" selected>Dos (seleccionado)</option>
        </select><br>

        <label>Número entre 5 y 10: <input type="number" min="5" max="10"></label><br>
        <label>Texto de 3 a 5 caracteres: <input type="text" minlength="3" maxlength="5" required autofocus></label><br>

        <input type="submit">
    </form>
</body>
</html>
