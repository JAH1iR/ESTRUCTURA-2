<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio en HTML5</title>
</head>
<body>
    <!--
        AUDIO: inserta sonido.
        - src: ruta del archivo.
        - controls: muestra controles de reproducción.
        - autoplay: reproduce automáticamente (recomendado con muted).
        - muted: silenciado.
        - loop: repite en ciclo.
    -->
    <h1>Reproductor de audio</h1>
    <audio src="audio/musica-fondo.mp3" controls autoplay muted loop>
        Tu navegador no soporta audio HTML5.
    </audio>
</body>
</html>
