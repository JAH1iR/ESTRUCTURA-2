<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos seleccionables - Radio y Checkbox</title>
</head>
<body>
    <!--
        RADIO: permite seleccionar UNA sola opción dentro del mismo grupo (mismo name).
        CHECKBOX: permite seleccionar varias opciones (mismo name o distintos).
        checked: atributo para marcar opción por defecto.
    -->
    <h1>Elementos Seleccionables</h1>
    <form>
        <h2>Género:</h2>
        <label><input type="radio" name="genero" value="masculino" checked> Masculino</label>
        <label><input type="radio" name="genero" value="femenino"> Femenino</label>
        <label><input type="radio" name="genero" value="otro"> Otro</label>

        <h2>Lenguajes que conoces:</h2>
        <label><input type="checkbox" name="lenguajes" value="html" checked> HTML</label>
        <label><input type="checkbox" name="lenguajes" value="css" checked> CSS</label>
        <label><input type="checkbox" name="lenguajes" value="js"> JavaScript</label>
    </form>
</body>
</html>
