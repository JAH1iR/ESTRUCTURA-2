<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura básica de HTML - Formulario</title>
</head>
<body>
    <!--
        ESTRUCTURA BÁSICA DE UN FORMULARIO:
        - <form>: engloba el formulario. Atributo action: destino de los datos.
        - <label>: texto descriptivo. Atributo for: vincula con el id del input.
        - <input>: campo de entrada. Atributo id: identificador único.
        - <button>: botón para enviar (por defecto type="submit").
    -->
    <form action="enviar.html" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br>
        <!-- Otra forma de label (menos recomendada) -->
        <label>
            Cédula:
            <input type="text" name="cedula">
        </label>
        <br>
        <button type="submit">Enviar formulario</button>
    </form>
</body>
</html>
