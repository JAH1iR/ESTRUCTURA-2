<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de input - Parte 2 (fechas y horas)</title>
</head>
<body>
    <!--
        INPUTS PARA FECHAS Y HORAS:
        - date: selector de fecha.
        - time: selector de hora.
        - datetime-local: fecha y hora (no funciona en Firefox).
        - month: mes y año.
        - week: número de semana del año.
        NOTA: datetime está obsoleto, no usar.
    -->
    <form>
        <label>Fecha: <input type="date"></label><br>
        <label>Hora: <input type="time"></label><br>
        <label>Fecha y hora local: <input type="datetime-local"></label><br>
        <label>Mes: <input type="month"></label><br>
        <label>Semana: <input type="week"></label><br>
    </form>
</body>
</html>
