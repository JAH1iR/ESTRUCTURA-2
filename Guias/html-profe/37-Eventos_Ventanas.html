<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones - Abrir Vantanas</title>
</head>

<body>
    <h5>Funciones - Open - Confirmar</h5>
    <form>
        Abrir en una pestaña
        <input type="button" value="Abrir" onclick="abrir()"><br><br>
        Abrir en otra ventana
        <input type="button" value="Abrir" onclick="ventana()"><br><br>
        <input type="button" value="Salir" onclick="confirmar()">
    </form>
    <script>
        function abrir(){
            let ventana = open();
            ventana.document.writeln('Soy otra pestaña en la página Web');
        }

        function ventana(){
            let ventana = open('', '',' width=400, height=250');
            ventana.document.writeln('Soy otra ventana de página Web')
        }

        function confirmar(){
            let respuesta = confirm('Desea Salir de la Página Web ?');
            if (respuesta == true){
                window.close();
            }
        }
    </script>
</body>
</html>
