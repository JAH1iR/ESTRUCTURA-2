<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Control Select</title>
</head>
<body>
    <h4>Controles de SEMAFOROS</h4>
    <form>
        <p>
            <select id="select1" onchange="cambiarcolor()">
                <option value="Puede Continuar">Verde</option>
                <option value="Precaución para Detenerse">Amarillo</option>
                <option value="Debe Detenerse">Rojo</option>
            </select>
        </p>
        <p>Indice seleccionado:<input type="text" id="texto1" size="2"></p>
        <p>Color seleccionado:<input type="text" id="texto2" size="9"></p>
        <p>Indicación:<input type="text" id="texto3" size="15"></p>
    </form>
    <script>
        function cambiarcolor(){
            let seleccion = document.getElementById('select1');
            document.getElementById('texto1').value = seleccion.selectedIndex;
            document.getElementById('texto2').value = seleccion.options[seleccion.selectedIndex].text;
            document.getElementById('texto3').value = seleccion.options[seleccion.selectedIndex].value;
        }
    </script>
</body>
</html>
